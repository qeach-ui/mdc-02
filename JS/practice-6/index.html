<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список задач</title>
</head>
<body>
    <h1>Список задач</h1>
    
    <div>
        <label>Задача (1–50 символов): 
            <input type="text" id="task-title">
        </label><br><br>
        
        <label>Ссылка (необязательно, только https): 
            <input type="text" id="task-url">
        </label><br><br>
        
        <button id="add-btn" type="button">Добавить задачу</button>
    </div>

    <p id="message"></p>
    
    <ul id="task-list"></ul>

    <script src="app.js"></script>
</body>
</html>
