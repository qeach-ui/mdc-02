<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>

<body>
    <h1>Практическая работа 8 TS</h1>

    <form id="product-form">
        <div>
            <label for="name">Название:</label>
            <input id="name" name="name" type="text" required>
        </div>

        <div>
            <label for="category">Категория:</label>
            <select id="category" name="category">
                <option value="Электроника">Электроника</option>
                <option value="Периферия">Периферия</option>
                <option value="Аксессуары">Аксессуары</option>
            </select>
        </div>

        <div>
            <label for="price">Цена:</label>
            <input id="price" name="price" type="number" min="0.01" step="any" required>
        </div>

        <div>
            <label for="quantity">Количество:</label>
            <input id="quantity" name="quantity" type="number" min="1" step="1" value="1" required>
        </div>

        <div>
            <label>
                <input id="featured" name="featured" type="checkbox">
                Рекомендуемый товар
            </label>
        </div>

        <button type="submit">Добавить</button>
    </form>

    <p id="error-message"></p>
    <p id="total-cost">Общая стоимость: 0 руб.</p>
    <ul id="product-list"></ul>

    <script src="dist/main.js"></script>
</body>

</html>
